<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YouTube player</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden}
  iframe{display:block;border:0;width:100%;height:100%;min-width:200px;min-height:200px}
  p{margin:0;padding:12px;font:13px system-ui,sans-serif;color:#fff}
</style>
</head>
<body>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var v = q.get("v"), list = q.get("list");
  var VID = /^[A-Za-z0-9_-]{6,20}$/, LID = /^[A-Za-z0-9_-]{2,64}$/;
  if (v !== null && !VID.test(v)) v = null;
  if (list !== null && !LID.test(list)) list = null;
  if (!v && !list) {
    var p = document.createElement("p");
    p.textContent = "Este enlace no se puede reproducir aquí.";
    document.body.appendChild(p);
    return;
  }
  var params = new URLSearchParams({ playsinline: "1", rel: "0", origin: location.origin });
  if (list) params.set("list", list);
  var f = document.createElement("iframe");
  f.src = "https://www.youtube.com/embed/" + (v ? encodeURIComponent(v) : "videoseries") + "?" + params.toString();
  f.title = "YouTube";
  f.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
  f.allowFullscreen = true;
  f.referrerPolicy = "strict-origin-when-cross-origin";
  document.body.appendChild(f);
})();
</script>
</body>
</html>
